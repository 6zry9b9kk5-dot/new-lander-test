
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#176b43">
  <title>نموذج تقديم وظيفي</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Tahoma, Arial, sans-serif;
      color: #18231d;
      background:
        radial-gradient(circle at 15% 10%, #dceee2, transparent 40%),
        linear-gradient(145deg, #f8fbf8, #edf5ef);
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 28px 22px 22px;
      background: #fff;
      border: 1px solid #e0e9e2;
      border-radius: 22px;
      box-shadow: 0 18px 55px rgba(24, 60, 39, 0.10);
    }

    .brand-mark {
      width: 54px;
      height: 6px;
      margin: 0 auto 18px;
      border-radius: 99px;
      background: #176b43;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 27px;
      line-height: 1.5;
      color: #176b43;
    }

    .subtitle {
      margin: 8px 0 24px;
      text-align: center;
      color: #66736b;
      font-size: 14px;
      line-height: 1.8;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      display: block;
      width: 100%;
      min-height: 50px;
      padding: 13px 14px;
      border: 1px solid #dce6df;
      border-radius: 12px;
      background: #fbfdfb;
      color: #18231d;
      font-family: inherit;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #176b43;
      box-shadow: 0 0 0 3px rgba(23, 107, 67, 0.10);
    }

    input::placeholder {
      color: #9aa69e;
    }

    button {
      width: 100%;
      min-height: 52px;
      margin-top: 5px;
      border: none;
      border-radius: 13px;
      background: #176b43;
      color: #fff;
      font-family: inherit;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 7px 16px rgba(23, 107, 67, 0.20);
    }

    button:hover {
      background: #105333;
    }

    .notice {
      margin: 17px 0 0;
      padding-top: 14px;
      border-top: 1px solid #edf1ee;
      color: #66736b;
      font-size: 12px;
      line-height: 1.9;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="card">

    <div class="brand-mark"></div>

    <h1>وظائف شركه المراعي </h1>

    <p class="subtitle">
      املأ البيانات التالية للمتابعة
    </p>

    <form id="applicationForm">

      <div class="field">
        <label for="fullName">الاسم الكامل</label>
        <input
          id="fullName"
          name="name"
          type="text"
          autocomplete="name"
          placeholder="اكتب اسمك الكامل"
          maxlength="100"
          required
        >
      </div>

      <div class="field">
        <label for="country">الدولة</label>
        <input
          id="country"
          name="country"
          type="text"
          autocomplete="country-name"
          placeholder="اكتب اسم الدولة"
          maxlength="80"
          required
        >
      </div>

      <div class="field">
        <label for="specialty">التخصص</label>
        <input
          id="specialty"
          name="specialty"
          type="text"
          placeholder="اكتب التخصص أو الوظيفة المطلوبة"
          maxlength="120"
          required
        >
      </div>

      <button type="submit">
        إرسال البيانات
      </button>

    </form>

    <p class="notice">
 
    
      
    </p>

  </main>

  <script>
    const SMARTLINK =
      "https://app.trcefy.com/sl?id=6a2050db46d3cf0d62f32aa4&pid=2&sub2=u833126&sub6=s2smartLink&sub5=s1SUBID1HERE";

    document
      .getElementById("applicationForm")
      .addEventListener("submit", function (event) {

        event.preventDefault();

        if (!this.reportValidity()) {
          return;
        }

        // فتح رابط SmartLink بعد استكمال الخانات.
        // لا تُرسل قيم الخانات إلى الرابط.
        window.location.href = SMARTLINK;
      });
  </script>

</body>
</html>
