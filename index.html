
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09060d">
<title></title>

<style>
*{
 box-sizing:border-box;
}

html,body{
 margin:0;
 width:100%;
 min-height:100%;
}

body{
 min-height:100vh;
 min-height:100dvh;
 background:#09060d;
 font-family:Arial,sans-serif;
 display:flex;
 flex-direction:column;
 overflow:hidden;
}

.container{
 width:100%;
 min-height:100vh;
 min-height:100dvh;
 display:flex;
 flex-direction:column;
}

.preview{
 position:relative;
 flex:1;
 min-height:0;
 width:100%;
 overflow:hidden;
 background:#09060d;
}

.preview img{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 display:block;
 object-fit:cover;
 object-position:center;
}

.overlay{
 position:absolute;
 inset:0;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 pointer-events:none;
}

.play{
 width:94px;
 height:94px;
 border-radius:50%;
 display:flex;
 justify-content:center;
 align-items:center;
 background:linear-gradient(135deg,#ec4ca0,#912b86);
 border:3px solid #ffffff75;
 box-shadow:0 0 35px #e63e9c99;
}

.triangle{
 width:0;
 height:0;
 border-top:17px solid transparent;
 border-bottom:17px solid transparent;
 border-left:25px solid white;
 margin-left:8px;
}

.countdown{
 margin-top:15px;
 font-size:38px;
 font-weight:800;
 color:white;
 text-shadow:0 2px 12px #000,0 0 15px #000;
}

.bottom{
 width:100%;
 padding:0 16px;
 padding-bottom:calc(14px + env(safe-area-inset-bottom));
 background:#09060d;
}

.continue{
 width:100%;
 padding:16px;
 border:0;
 border-radius:15px;
 color:white;
 font-size:18px;
 font-weight:800;
 background:linear-gradient(110deg,#9c287e,#e44991);
 box-shadow:0 8px 25px #c22b8150;
 cursor:pointer;
 font-family:inherit;
}

.continue:active{
 transform:scale(.98);
}
</style>
</head>

<body>

<div class="container">

 <div class="preview">

  <img
   src="./921AD2C8-65A5-4010-BA02-8CB0C85E33E3.png"
   alt=""
  >

  <div class="overlay">

   <div class="play">
    <div class="triangle"></div>
   </div>

   <div class="countdown" id="countdown">3</div>

  </div>

 </div>

 <div class="bottom">

  <button class="continue" id="continueBtn">
   Continue
  </button>

 </div>

</div>

<script>

/* ONELEAD SMARTLINK */

const smartLink =
"https://onelead.odinllm.com/?utm_medium=f4971a16d63e6b3940dce3348a955147548b040f&utm_campaign=cr7";


/* ALL LANGUAGE TRANSLATIONS */

const translations = {
 en:{button:"Continue"},
 sw:{button:"Endelea"},
 pt:{button:"Continuar"},
 fil:{button:"Magpatuloy"},
 bn:{button:"চালিয়ে যান"},
 id:{button:"Lanjutkan"},
 ur:{button:"جاری رکھیں"},
 ar:{button:"متابعة"}
};


/* ARABIC COUNTRIES */

const arabicCountries=[
 "EG","SA","AE","KW","QA","BH","OM","JO","IQ",
 "LB","SY","YE","PS","DZ","MA","TN","LY","SD",
 "MR","SO","DJ","KM"
];


/* COUNTRY TO LANGUAGE */

function languageFor(country){

 if(arabicCountries.includes(country)) return "ar";
 if(country==="KE") return "sw";
 if(country==="MZ") return "pt";
 if(country==="PH") return "fil";
 if(country==="BD") return "bn";
 if(country==="ID") return "id";
 if(country==="PK") return "ur";

 return "en";
}


/* APPLY LANGUAGE */

function applyLanguage(lang){

 const t=translations[lang]||translations.en;

 document.documentElement.lang=lang;

 document.documentElement.dir=
  (lang==="ar"||lang==="ur")?"rtl":"ltr";

 document.getElementById("continueBtn").textContent=
  t.button;
}


/* AUTOMATIC IP COUNTRY DETECTION */

async function start(){

 try{

  const response=await fetch(
   "https://ipapi.co/json/"
  );

  if(!response.ok)
   throw new Error("IP lookup failed");

  const data=await response.json();

  const country=data.country_code||"";

  applyLanguage(languageFor(country));

 }catch(error){

  applyLanguage("en");

 }

}


/* SMARTLINK REDIRECT */

function redirect(){

 window.location.href=smartLink;

}


/* CONTINUE BUTTON */

document.getElementById("continueBtn")
.addEventListener("click",redirect);


/* COUNTDOWN 3 - 2 - 1 */

let seconds=3;

const countdown=
 document.getElementById("countdown");

const timer=setInterval(()=>{

 seconds--;

 if(seconds<=0){

  clearInterval(timer);

  redirect();

  return;

 }

 countdown.textContent=seconds;

},1000);


/* START */

start();

</script>

</body>
</html>
